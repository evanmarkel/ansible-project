- name: Install Alloy package
  ansible.builtin.package:
    name: alloy
    state: present

- name: Ensure Alloy config directory exists
  ansible.builtin.file:
    path: /etc/alloy
    state: directory
    mode: '0755'

- name: Write Alloy config from alloy_config var
  ansible.builtin.copy:
    content: "{{ alloy_config }}"
    dest: /etc/alloy/config.alloy
    mode: '0644'

- name: Start Alloy
  ansible.builtin.shell: |
    nohup alloy run /etc/alloy/config.alloy >/var/log/alloy.log 2>&1 &
  args:
    executable: /bin/bash

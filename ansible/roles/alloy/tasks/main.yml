---
# 1. Download Alloy on control machine
- name: Ensure download directory exists
  delegate_to: localhost
  file:
    path: "/tmp/alloy-download"
    state: directory

- name: Download Alloy ZIP
  delegate_to: localhost
  get_url:
    url: "https://github.com/grafana/alloy/releases/download/v1.7.0/alloy-linux-amd64.zip"
    dest: "/tmp/alloy-download/alloy.zip"

- name: Extract Alloy ZIP
  delegate_to: localhost
  unarchive:
    src: "/tmp/alloy-download/alloy.zip"
    dest: "/tmp/alloy-download"
    remote_src: no

# 2. Prepare output directory
- name: Ensure output directory exists
  file:
    path: "{{ output_dir }}"
    state: directory
    mode: '0755'

# 3. Copy Alloy binary
- name: Copy Alloy binary
  copy:
    src: "/tmp/alloy-download/alloy"
    dest: "{{ output_dir }}/alloy"
    mode: '0755'

# 4. Render Alloy config
- name: Render Alloy config
  template:
    src: "config.yaml.j2"
    dest: "{{ output_dir }}/config.yaml"
    mode: '0644'

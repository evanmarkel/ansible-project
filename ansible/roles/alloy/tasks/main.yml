---
# Install dependencies
- name: Ensure required packages are installed
  apt:
    name:
      - curl
      - ca-certificates
      - unzip
    state: present
    update_cache: yes

# Get Alloy zip
- name: Download Alloy zip
  get_url:
    url: "{{ alloy_binary_url }}"
    dest: /tmp/alloy.zip
    mode: "0644"

# Extract zip
- name: Extract Alloy zip
  unarchive:
    src: /tmp/alloy.zip
    dest: /usr/local/bin
    remote_src: yes

# Rename (clean up later)
- name: Rename Alloy binary
  command: mv /usr/local/bin/alloy-linux-amd64 /usr/local/bin/alloy
  args:
    removes: /usr/local/bin/alloy-linux-amd64

# Make sure it works
- name: Ensure Alloy binary is executable
  file:
    path: /usr/local/bin/alloy
    mode: "0755"  

# Create config directory
- name: Ensure Alloy config directory exists
  file:
    path: "{{ alloy_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Deploy Alloy config
- name: Deploy Alloy configuration
  template:
    src: alloy-config.yaml.j2
    dest: "{{ alloy_config_path }}"
    owner: root
    group: root
    mode: "0644"

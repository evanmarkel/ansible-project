---
# Install dependencies
- name: Ensure required packages are installed
  apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: yes

# Install Alloy binary
- name: Download Alloy binary
  get_url:
    url: "{{ alloy_binary_url }}"
    dest: /usr/local/bin/alloy
    mode: "0755"
  notify: restart alloy

# Create config directory
- name: Ensure Alloy config directory exists
  file:
    path: "{{ alloy_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Deploy Alloy config
- name: Deploy Alloy configuration
  template:
    src: alloy-config.yaml.j2
    dest: "{{ alloy_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart alloy

# Install systemd service
- name: Install Alloy systemd service
    template:
      src: systemd-alloy.service.j2
      dest: "/etc/systemd/system/{{ alloy_service_name }}.service"
      owner: root
      group: root
      mode: "0644"
    notify: restart alloy

# Enable + start Alloy
- name: Ensure Alloy service is enabled and running
  systemd:
    name: "{{ alloy_service_name }}"
    enabled: true
    state: started

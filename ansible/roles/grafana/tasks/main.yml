---
# Ensure provisioning directories exist
- name: Ensure Grafana provisioning directories exist
  file:
    path: "/etc/grafana/provisioning/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - datasources
    - dashboards
    - alerting

# Copy datasource provisioning
- name: Copy Grafana datasource provisioning
  copy:
    src: provisioning/datasources/
    dest: /etc/grafana/provisioning/datasources/
    owner: root
    group: root
    mode: "0644"

# Copy dashboard provider + dashboards
- name: Copy Grafana dashboard provisioning
  copy:
    src: provisioning/dashboards/
    dest: /etc/grafana/provisioning/dashboards/
    owner: root
    group: root
    mode: "0644"

# Copy alert rules
- name: Copy Grafana alert rule provisioning
  copy:
    src: provisioning/alerting/
    dest: /etc/grafana/provisioning/alerting/
    owner: root
    group: root
    mode: "0644"

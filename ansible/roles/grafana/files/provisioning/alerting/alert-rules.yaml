apiVersion: 1
groups:
  - name: host-alerts
    interval: 1m
    rules:

      # -----------------------------
      # High CPU Usage (5m sustained)
      # -----------------------------
      - uid: high_cpu_usage
        title: "High CPU Usage"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: timeSeriesQuery
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: rate(process_cpu_seconds_total[5m])
              legendFormat: "{{instance}}"
              interval: ""
          - refId: B
            datasourceUid: prometheus
            queryType: reduce
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expression: A
              reducer: max
              type: reduce
          - refId: C
            datasourceUid: prometheus
            queryType: threshold
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [0.80]
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage has exceeded 80% for more than 5 minutes."

      # -----------------------------
      # Low Memory Alert
      # -----------------------------
      - uid: low_memory
        title: "Low Available Memory"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: timeSeriesQuery
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: process_resident_memory_bytes
              legendFormat: "{{instance}}"
              interval: ""
          - refId: B
            datasourceUid: prometheus
            queryType: reduce
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expression: A
              reducer: min
              type: reduce
          - refId: C
            datasourceUid: prometheus
            queryType: threshold
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [500000000]   # 500MB
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Low memory detected"
          description: "Available memory has dropped below 500MB for more than 5 minutes."

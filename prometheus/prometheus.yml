global:
  scrape_interval: 15s
  evaluation_interval: 15s

# federated alloy - each writes metrics to volume
remote_write:
  - url: "http://prometheus:9090/api/v1/write"

# Prometheus scrapes its own metrics
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alloy'
    static_configs:
      - targets: ['host-a:12345']
        labels:
          host: 'host-a'
      - targets: ['host-b:12345']
        labels:
          host: 'host-b'

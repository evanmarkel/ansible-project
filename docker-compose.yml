services:
  host-a:
    image: gotechnies/alpine-ssh
    container_name: host-a
    ports:
      - "2222:22"
    networks:
      - observability
    volumes:
      - ./ansible/ssh/host-a_authorized_keys:/root/.ssh/authorized_keys
    command: >
      sh -c "apk add --no-cache python3 &&
             mkdir -p /root/.ssh &&
             chmod 700 /root/.ssh &&
             chmod 600 /root/.ssh/authorized_keys &&
             /usr/sbin/sshd -D"
  
  host-b:
    image: gotechnies/alpine-ssh
    container_name: host-b
    ports:
      - "2223:22"
    networks:
      - observability
    volumes:
      - ./ansible/ssh/host-b_authorized_keys:/root/.ssh/authorized_keys
    command: >
      sh -c "apk add --no-cache python3 &&
             mkdir -p /root/.ssh &&
             chmod 700 /root/.ssh &&
             chmod 600 /root/.ssh/authorized_keys &&
             /usr/sbin/sshd -D"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - observability
    
networks:
  observability:
    name: observability

volumes:
  prometheus-data:
  grafana-data:

services:
  host-a:
    image: panubo/sshd:1.4.0
    container_name: host-a
    environment:
      - SSH_ENABLE_ROOT=true
    volumes:
      - ./ansible/ssh/host-a_authorized_keys:/root/.ssh/authorized_keys:ro
    ports:
      - "2222:22"
    networks:
      - observability

  host-b:
    image: panubo/sshd:1.4.0
    container_name: host-b
    environment:
      - SSH_ENABLE_ROOT=true
    volumes:
      - ./ansible/ssh/host-b_authorized_keys:/root/.ssh/authorized_keys:ro
    ports:
      - "2223:22"
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - observability
    
networks:
  observability:
    name: observability

volumes:
  prometheus-data:
  grafana-data:
